<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E2A1B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>All Aboard Earth — Up We Go!</title>
    <meta name="description" content="A regenerative hip-hop movement — music that plants seeds, lifts communities, and puts the next generation on board for a thriving planet." />

    <!-- Fonts are self-hosted: Google Fonts cost a DNS + connect + CSS round
         trip before the font file is even requested, and the hero headline
         (Anton) is the LCP element, so that chain set the LCP floor. -->
    <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Anton';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/anton-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url('/fonts/bricolage-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/spacemono-400-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Mono';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/spacemono-700-latin.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
