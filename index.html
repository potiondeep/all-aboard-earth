<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C5178" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>All Aboard Earth — Up We Go!</title>
    <meta name="description" content="All Aboard Earth is a movement igniting the visionary willpower of humanity to foster ecological health through green career pathways, environmental edutainment and regenerative art." />

    <!-- Fonts are self-hosted: Google Fonts cost a DNS + connect + CSS round
         trip before the font file is even requested, and the hero headline
         (Anton) is the LCP element, so that chain set the LCP floor. -->
    <!-- The hero record is the largest above-the-fold element. Served from
         /art (stable path, no bundler hash) so it can be preloaded here rather
         than discovered only once React has rendered. -->
    <link
      rel="preload"
      as="image"
      href="/art/felt-earth-poster.webp"
      imagesrcset="/art/felt-earth-poster-400.webp 450w, /art/felt-earth-poster.webp 900w"
      imagesizes="min(86vw, 644px)"
      fetchpriority="high"
    />
    <link rel="canonical" href="https://www.allaboardearth.com" />
    <link rel="preload" as="image" href="/art/felt-logo-1200.webp"
      imagesrcset="/art/felt-logo-600.webp 600w, /art/felt-logo-900.webp 900w, /art/felt-logo-1200.webp 1200w"
      imagesizes="min(73vw, 422px)" fetchpriority="high" />
    <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Anton';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/anton-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url('/fonts/bricolage-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/spacemono-400-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Mono';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/spacemono-700-latin.woff2') format('woff2');
      }
    </style>
    <style>
      /* boot paint — mirrors .hero padding + .hero-mark/.earth-wrap sizing */
      .boot{ position:absolute; top:0; left:0; right:0; pointer-events:none;
        --nav-h:100px; --mark-w:min(43vw,248px); --earth-w:min(86vw,644px);
        --hero-top:calc(0px - (120px - var(--nav-h)));
        --mark-top:calc(var(--hero-top) + clamp(110px,26vh,250px) + 120px);
      }
      @media (min-width:561px){ .boot{ --nav-h:82px; } }
      .boot-earth{ position:absolute; left:50%; width:var(--earth-w); height:var(--earth-w);
        top:calc(var(--mark-top) + (var(--mark-w) * 0.9099 / 2) - (var(--earth-w) / 2));
        transform:translateX(-50%); object-fit:contain; display:block;
        filter:
          drop-shadow(0 16px 30px rgba(0,0,0,.80))
          drop-shadow(0 0 22px rgba(111,211,255,.48))
          drop-shadow(0 0 60px rgba(111,211,255,.23));
      }
    </style>
  </head>
  <body>
    <!-- Boot paint: the Earth poster is the LCP element, but it only exists in
         React's markup, so on a throttled phone it cannot paint until the bundle
         has parsed — LCP sat ~1.4s behind FCP. This draws it from HTML at exactly
         the position the hero gives it (same clamp() maths), and createRoot clears
         it the moment React mounts, onto the same cached image. -->
    <div id="root">
      <div class="boot" aria-hidden="true">
        <img class="boot-earth" src="/art/felt-earth-poster.webp"
             srcset="/art/felt-earth-poster-400.webp 450w, /art/felt-earth-poster.webp 900w"
             sizes="min(86vw, 644px)" alt="" width="900" height="900" fetchpriority="high" decoding="async" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
